<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>直升機打擊模擬</title>
<style>
:root{--fg:#fff;--bg:#0b0e10;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0e10;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;transition:filter .5s;}
#gl.sensor{filter:grayscale(1) contrast(1.12) brightness(1.03);}
#hud{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;}
.btn{position:fixed;border-radius:50%;border:4px solid rgba(255,255,255,.85);background:rgba(0,0,0,.18);color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;line-height:1.1;}
.btn.dim{opacity:.45;}
.btn.hot{background:rgba(198,40,40,.75);border-color:#fff;}
.btn small{font-size:.5em;font-weight:700;margin-top:2px;}
#stick{position:fixed;border-radius:50%;border:4px solid rgba(255,255,255,.8);background:rgba(0,0,0,.14);pointer-events:auto;}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(220,224,228,.85);}
.hidden{display:none !important;}
#ui{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;}
.screen{position:fixed;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(6,9,11,.86);padding:16px;overflow:auto;}
.card{width:min(960px,96vw);max-height:96vh;overflow:auto;background:#111315;border:2px solid #fff;padding:22px 26px;}
.card h1{margin:0 0 8px;font-size:clamp(22px,4.6vmin,40px);font-weight:900;line-height:1.25;}
.card h2{margin:14px 0 6px;font-size:clamp(17px,3.2vmin,26px);font-weight:900;}
.card p,.card li{font-size:clamp(15px,2.6vmin,21px);font-weight:700;line-height:1.5;margin:4px 0;}
.card .sub{color:#c4cacd;}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.ub{border:2px solid #fff;background:#1d2225;color:#fff;font-weight:900;font-size:clamp(16px,2.8vmin,22px);padding:12px 20px;cursor:pointer;min-height:48px;}
.ub.primary{background:#c62828;}
.ub.ghost{background:transparent;}
.ub:active{transform:translateY(1px);}
.tag{display:inline-block;border:2px solid #fff;padding:2px 10px;font-weight:900;font-size:clamp(13px,2.2vmin,17px);margin-right:6px;}
.tag.red{background:#c62828;border-color:#c62828;}
.tag.green{background:#2e7d32;border-color:#2e7d32;}
.tag.grey{background:#444;border-color:#444;}
table.rev{width:100%;border-collapse:collapse;margin-top:6px;}
table.rev td,table.rev th{border-bottom:1px solid #3a4044;padding:8px 6px;font-size:clamp(14px,2.5vmin,20px);font-weight:700;text-align:left;}
table.rev th{color:#c4cacd;font-weight:900;}
.src{border:1px solid #3a4044;padding:10px 12px;margin:8px 0;background:#15181b;}
.src a{color:#9fd3ff;word-break:break-all;font-weight:700;}
.opt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;}
.opt span{font-weight:900;min-width:110px;font-size:clamp(15px,2.6vmin,20px);}
.opt button{border:2px solid #777;background:#1d2225;color:#fff;font-weight:900;padding:8px 14px;font-size:clamp(14px,2.4vmin,18px);}
.opt button.on{border-color:#fff;background:#2e7d32;}
#aiPanel{position:fixed;pointer-events:auto;background:rgba(11,14,16,.9);border:2px solid #fff;border-radius:8px;padding:14px 16px;color:#fff;}
#aiPanel .t{font-size:clamp(17px,3.4vmin,26px);font-weight:900;text-align:center;}
#aiPanel .l{font-size:clamp(13px,2.4vmin,18px);font-weight:700;color:#c9d1d4;text-align:center;margin-top:6px;}
#aiPanel .p{font-size:clamp(44px,11vmin,78px);font-weight:900;color:#ff5a3c;text-align:center;line-height:1.05;}
#aiPanel .bar{height:12px;border:1.5px solid #fff;margin:6px 0 10px;}
#aiPanel .bar i{display:block;height:100%;background:#ff5a3c;}
#aiPanel .v{font-size:clamp(17px,3.2vmin,24px);font-weight:900;text-align:center;}
#aiPanel .b{font-size:clamp(12px,2.2vmin,16px);font-weight:700;color:#aab4b8;text-align:center;margin-top:4px;}
#aiPanel .btns{display:flex;gap:8px;margin-top:12px;}
#aiPanel .btns button{flex:1;border:2px solid #fff;color:#fff;font-weight:900;font-size:clamp(20px,4.2vmin,30px);padding:14px 4px;border-radius:8px;}
#atk{background:#c62828;}
#abd{background:rgba(0,0,0,.25);}
#aiPanel .warn{font-size:clamp(14px,2.6vmin,19px);font-weight:900;color:#ffd6d0;text-align:center;margin-top:8px;}
#tip{position:fixed;left:0;right:0;bottom:4px;text-align:center;font-weight:900;font-size:14px;color:#ffe08a;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none;}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="stick" class="hidden"><div id="knob"></div></div>
<div id="bAccel" class="btn hidden">加速</div>
<div id="bGun" class="btn hidden">機槍<small>按住射擊</small></div>
<div id="bMis" class="btn hidden dim">飛彈<small id="misN">剩 4 枚</small></div>
<div id="aiPanel" class="hidden">
  <div class="t">AI 輔助判讀</div>
  <div class="l">軍事目標機率</div>
  <div class="p" id="aiP">87%</div>
  <div class="bar"><i id="aiBar" style="width:87%"></i></div>
  <div class="v" id="aiV">判定：敵方戰車</div>
  <div class="b" id="aiB">依據：履帶、前方長形結構</div>
  <div class="warn hidden" id="aiW">確定放棄？本目標威脅機率 87%</div>
  <div class="btns"><button id="atk">攻擊</button><button id="abd">放棄</button></div>
</div>
<div id="tip" class="hidden">把手機橫放，畫面更寬、操作更順手</div>
<div id="ui"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   直升機打擊模擬  —  課堂立體遊戲（單一檔）
   三幕：巡邏打擊（第一人稱）→ 無人機遭入侵 → 城鎮追擊（第三人稱）
   ============================================================ */
'use strict';
const Q = new URLSearchParams(location.search);
const PITCH = 50, BLK = 34, ZONE_R = 6*50+25+40;   // 任務區半寬 365 m
const CITY_N = 6;                                   // 街區索引 -6..6
const NO_SOUND = true;

/* ---------- 設定（存在手機瀏覽器） ---------- */
const SET = {sens:1, quality:'high', sound:true};
try{ const s=JSON.parse(localStorage.getItem('heli_set')||'{}'); Object.assign(SET,s);}catch(e){}
function saveSet(){ try{localStorage.setItem('heli_set',JSON.stringify(SET));}catch(e){} }

/* ---------- 隨機 ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = mulberry(11);          // 城市固定
const RR = Math.random;          // 關卡隨機
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- 繪圖器 ---------- */
const glc=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,powerPreference:'high-performance'});
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=new THREE.Color(0xd6dadd).convertSRGBToLinear();
scene.background=SKY; scene.fog=new THREE.Fog(SKY,120,560);
const camera=new THREE.PerspectiveCamera(60,1,0.3,1500);
let W=1,H=1,DPR=1;
function applyQuality(){
  const hi=SET.quality==='high';
  DPR=hi?Math.min(devicePixelRatio||1,2):1;
  renderer.setPixelRatio(DPR);
  renderer.shadowMap.enabled=hi;
  sun.castShadow=hi;
  scene.traverse(o=>{ if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);} });
}
function resize(){
  W=innerWidth;H=innerHeight;
  renderer.setSize(W,H,false);
  camera.aspect=W/H;camera.updateProjectionMatrix();
  hud.width=Math.floor(W*Math.min(devicePixelRatio||1,2));hud.height=Math.floor(H*Math.min(devicePixelRatio||1,2));
  hud.style.width=W+'px';hud.style.height=H+'px';
  layoutControls();
}
addEventListener('resize',resize);

/* ---------- 燈光 ---------- */
scene.add(new THREE.HemisphereLight(0xeef2f6,0x6b665f,.62));
const sun=new THREE.DirectionalLight(0xfff3e2,.82);
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-140;sc.right=140;sc.top=140;sc.bottom=-140;sc.near=1;sc.far=500;sun.shadow.bias=-0.0008;
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xdfe6ee,.35);fill.position.set(80,60,160);scene.add(fill);
function sunFollow(x,z){sun.position.set(x-110,230,z+70);sun.target.position.set(x,0,z);}

/* ---------- 材質工具 ---------- */
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.encoding=THREE.sRGBEncoding;if(rep)t.repeat.set(rep,rep);return t;}
function noise(g,w,h,n,a){for(let i=0;i<n;i++){g.fillStyle=R()<.5?`rgba(0,0,0,${a*R()})`:`rgba(255,255,255,${a*R()})`;g.fillRect(R()*w,R()*h,1+R()*3,1+R()*3);}}
function wallTex(base,kind){return ctex(256,256,(g,w,h)=>{
  g.fillStyle=base;g.fillRect(0,0,w,h);noise(g,w,h,4000,.12);
  if(kind==='brick'){g.strokeStyle='rgba(225,200,180,.28)';g.lineWidth=1;for(let y=0;y<h;y+=5){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke();for(let x=((y/5)%2)*6;x<w;x+=12){g.beginPath();g.moveTo(x+.5,y);g.lineTo(x+.5,y+5);g.stroke();}}}
  else{g.strokeStyle='rgba(0,0,0,.10)';for(let y=0;y<h;y+=16){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke();}}
  for(let fy=0;fy<4;fy++){
    g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,fy*64+60,w,3);
    g.fillStyle='rgba(235,228,214,.55)';g.fillRect(0,fy*64+58,w,2);
    for(let fx=0;fx<4;fx++){
      const x=fx*64+18,y=fy*64+12,ww=28,hh=32;
      g.fillStyle='#231d1a';g.fillRect(x-3,y-3,ww+6,hh+5);
      const gr=g.createLinearGradient(x,y,x+ww,y+hh);const dark=R()<.12;
      gr.addColorStop(0,dark?'#0d0d0e':'#46525b');gr.addColorStop(1,dark?'#151515':'#1c2329');
      g.fillStyle=gr;g.fillRect(x,y,ww,hh);
      if(!dark){g.fillStyle='#6b6e6f';g.fillRect(x+ww/2-1,y,2,hh);g.fillRect(x,y+hh*.38,ww,2);}
      g.fillStyle='#d8d1c4';g.fillRect(x-5,y+hh+2,ww+10,4);
      g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x-5,y+hh+6,ww+10,2);
    }}
});}
const WALLS=[wallTex('#8d4c39','brick'),wallTex('#9b5a44','brick'),wallTex('#b8a07a','stone'),wallTex('#c7b99c','stone'),wallTex('#a9a59e','stone'),wallTex('#7c4433','brick')];
const wallMats=WALLS.map(t=>new THREE.MeshLambertMaterial({map:t}));
const roofTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#a19d95';g.fillRect(0,0,w,h);noise(g,w,h,5000,.14);g.strokeStyle='rgba(0,0,0,.08)';for(let i=0;i<w;i+=32){g.beginPath();g.moveTo(i,0);g.lineTo(i,h);g.stroke();g.beginPath();g.moveTo(0,i);g.lineTo(w,i);g.stroke();}for(let i=0;i<6;i++){g.fillStyle='rgba(60,55,50,.08)';g.beginPath();g.arc(R()*w,R()*h,10+R()*30,0,7);g.fill();}});
const roofMat=new THREE.MeshLambertMaterial({map:roofTex});
const asphTex=ctex(512,512,(g,w,h)=>{g.fillStyle='#55585c';g.fillRect(0,0,w,h);noise(g,w,h,18000,.16);g.strokeStyle='rgba(20,20,22,.55)';g.lineWidth=1.4;for(let i=0;i<9;i++){let x=R()*w,y=R()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<7;k++){x+=(R()-.5)*60;y+=(R()-.5)*60;g.lineTo(x,y);}g.stroke();}},80);
const walkTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#9b9d9e';g.fillRect(0,0,w,h);noise(g,w,h,4000,.12);g.strokeStyle='rgba(0,0,0,.14)';for(let i=0;i<w;i+=32){g.beginPath();g.moveTo(i+.5,0);g.lineTo(i+.5,h);g.stroke();g.beginPath();g.moveTo(0,i+.5);g.lineTo(w,i+.5);g.stroke();}});
const sandTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#b9a98a';g.fillRect(0,0,w,h);noise(g,w,h,6000,.16);});
const grassTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#6f8a4e';g.fillRect(0,0,w,h);noise(g,w,h,7000,.18);});
const plazaTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#b3b0a8';g.fillRect(0,0,w,h);noise(g,w,h,3000,.1);g.strokeStyle='rgba(0,0,0,.18)';for(let i=0;i<w;i+=64){g.beginPath();g.moveTo(i+.5,0);g.lineTo(i+.5,h);g.stroke();g.beginPath();g.moveTo(0,i+.5);g.lineTo(w,i+.5);g.stroke();}});
const lam=(c)=>new THREE.MeshLambertMaterial({color:new THREE.Color(c).convertSRGBToLinear()});
const std=(c,r,m,flat)=>new THREE.MeshStandardMaterial({color:new THREE.Color(c).convertSRGBToLinear(),roughness:r??.8,metalness:m??.15,flatShading:!!flat});
const basic=(c,o)=>new THREE.MeshBasicMaterial({color:new THREE.Color(c).convertSRGBToLinear(),transparent:o!==undefined,opacity:o??1,depthWrite:o===undefined});

/* ---------- 城市（合併幾何，減少繪製次數） ---------- */
const buildings=[];           // 碰撞與小地圖：{x,z,w,d,h}
const zonesDef=[
  {name:'工地',    bi:-4,bj:-3, real:'tank',     civ:'dozer',      realName:'戰車',     civName:'推土機',   aiLabel:'敵方戰車',   basis:'履帶、前方長形結構', ground:'sand'},
  {name:'物流倉庫',bi:3, bj:-4, real:'gunTruck', civ:'boxTruck',   realName:'武裝車輛', civName:'民用卡車', aiLabel:'敵方武裝車輛', basis:'車頂裝置、車身外形', ground:'yard'},
  {name:'郊區道路',road:true, x:275, z:60, real:'apc', civ:'plow',  realName:'裝甲運兵車',civName:'鏟雪車',  aiLabel:'裝甲運兵車', basis:'多輪底盤、傾斜前裝甲'},
  {name:'公園',    bi:-2,bj:3,  real:'mortar',   civ:'playground', realName:'迫擊砲陣地',civName:'遊樂器材', aiLabel:'迫擊砲陣地', basis:'管狀結構、環形掩體', ground:'grass'},
  {name:'廣場',    bi:2, bj:4,  real:'spg',      civ:'excavator',  realName:'自走砲',   civName:'挖土機',   aiLabel:'自走砲',     basis:'長砲管、履帶底盤', ground:'plaza'},
];
zonesDef.forEach(z=>{ if(!z.road){z.x=z.bi*PITCH;z.z=z.bj*PITCH;} });
const specialBlocks={};
zonesDef.forEach(z=>{ if(!z.road) specialBlocks[z.bi+','+z.bj]=z; });
specialBlocks['4,1']={ground:'grass',park:true}; specialBlocks['-5,5']={ground:'grass',park:true};

const merge={};               // 依材質名稱累積
function pushGeo(key,mat,geo,x,y,z){
  const g=geo.index?geo.toNonIndexed():geo; g.translate(x,y,z);
  if(!merge[key]) merge[key]={mat,pos:[],nor:[],uv:[]};
  const m=merge[key]; m.pos.push(g.attributes.position.array); m.nor.push(g.attributes.normal.array); m.uv.push(g.attributes.uv.array);
}
function boxUV(geo,w,h,d){ // 牆面依公尺尺度重複貼圖（12 m × 12.8 m 一格）
  const uv=geo.attributes.uv;
  for(let f=0;f<6;f++){ if(f===2||f===3) continue; const span=f<2?d:w; for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*span/12,uv.getY(k)*h/12.8);} }
}
function addBuilding(x,z,w,d,floors){
  const h=floors*3.2;
  const g=new THREE.BoxGeometry(w,h,d); boxUV(g,w,h,d);
  const wi=Math.floor(R()*wallMats.length);
  // 牆面與屋頂分開合併：牆面用 groups→拆成兩份
  const side=g.clone(); const roof=g.clone();
  // 刪除屋頂/底面：以 index 分組
  const idx=g.index.array; const sideIdx=[],roofIdx=[];
  for(let f=0;f<6;f++){ for(let k=0;k<6;k++){ const v=idx[f*6+k]; (f===2?roofIdx:(f===3?null:sideIdx))?.push(v);} }
  side.setIndex(sideIdx); roof.setIndex(roofIdx);
  pushGeo('wall'+wi,wallMats[wi],side,x,h/2+.25,z);
  pushGeo('roof',roofMat,roof,x,h/2+.25,z);
  pushGeo('cap',lam(0xb9b3a7),new THREE.BoxGeometry(w+.5,.5,d+.5),x,h+.5,z);
  const n=Math.floor(R()*3);
  for(let i=0;i<n;i++){const s=1.4+R()*2;pushGeo('unit',lam(0x9a9890),new THREE.BoxGeometry(s,1+R()*.8,s*(.8+R()*.6)),x+(R()-.5)*(w-5),h+1.1,z+(R()-.5)*(d-5));}
  buildings.push({x,z,w,d,h:h+.75});
}
function addTree(x,z,s){
  pushGeo('trunk',lam(0x5a4634),new THREE.CylinderGeometry(.18*s,.25*s,2*s,5),x,s+.25,z);
  pushGeo('leaf',lam(0x4f6b3a),new THREE.IcosahedronGeometry(1.8*s,0),x,2.6*s+.25,z);
}
const carCols=[0x7d8288,0x5b6e7d,0x8a3b30,0xbdbab3,0x3f4a3c];
function addCar(x,z,ry){
  const c=carCols[Math.floor(R()*carCols.length)];
  const b=new THREE.BoxGeometry(1.9,.8,4.3); b.rotateY(ry); pushGeo('car'+c,lam(c),b,x,.75,z);
  const t=new THREE.BoxGeometry(1.7,.7,2.2); t.translate(0,0,-.2); t.rotateY(ry); pushGeo('car'+c,lam(c),t,x,1.45,z);
  const g=new THREE.BoxGeometry(1.72,.5,2.0); g.translate(0,0,-.2); g.rotateY(ry); pushGeo('glass',lam(0x22282d),g,x,1.47,z);
}
function buildCity(){
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),new THREE.MeshLambertMaterial({map:asphTex}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  const gm={sand:new THREE.MeshLambertMaterial({map:sandTex}),grass:new THREE.MeshLambertMaterial({map:grassTex}),plaza:new THREE.MeshLambertMaterial({map:plazaTex}),yard:new THREE.MeshLambertMaterial({map:plazaTex}),walk:new THREE.MeshLambertMaterial({map:walkTex})};
  for(const k in gm){gm[k].map.repeat.set(4,4);}
  for(let i=-CITY_N;i<=CITY_N;i++)for(let j=-CITY_N;j<=CITY_N;j++){
    const cx=i*PITCH,cz=j*PITCH; const sp=specialBlocks[i+','+j];
    const grd=sp?sp.ground:'walk';
    pushGeo('g_'+grd,gm[grd],new THREE.BoxGeometry(BLK+(sp?6:0),.25,BLK+(sp?6:0)),cx,.125,cz);
    if(sp){
      if(sp.park){ for(let k=0;k<9;k++)addTree(cx+(R()-.5)*28,cz+(R()-.5)*28,.9+R()*.5); continue; }
      if(sp.ground==='grass'){ for(let k=0;k<10;k++){const a=k/10*6.283;addTree(cx+Math.cos(a)*17,cz+Math.sin(a)*17,1+R()*.3);} }

function hitBuilding(px,py,pz,m){ for(const b of buildings){ if(Math.abs(px-b.x)<b.w/2+m&&Math.abs(pz-b.z)<b.d/2+m&&py<b.h+m) return b; } return null; }
function segmentBlocked(a,b){ // 線段是否被建築擋住（slab 法）
  const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
  for(const bd of buildings){
    const minx=bd.x-bd.w/2,maxx=bd.x+bd.w/2,minz=bd.z-bd.d/2,maxz=bd.z+bd.d/2;
    let t0=0,t1=1;
    const sl=(p,d,lo,hi)=>{ if(Math.abs(d)<1e-9){ return p>=lo&&p<=hi; } let ta=(lo-p)/d,tb=(hi-p)/d; if(ta>tb){const q=ta;ta=tb;tb=q;} if(ta>t0)t0=ta; if(tb<t1)t1=tb; return t0<=t1; };
    if(!sl(a.x,dx,minx,maxx)) continue; if(!sl(a.z,dz,minz,maxz)) continue; if(!sl(a.y,dy,-1,bd.h)) continue;
    if(t0<=t1) return true;
  }
  return false;
}

function loft(secs,ch){
  const pos=[],idx=[];const N=8;
  for(const [z,w,hh,y] of secs){const a=w/2,b=hh/2,c=Math.min(a,b)*ch;const pts=[[a,b-c],[a-c,b],[-a+c,b],[-a,b-c],[-a,-b+c],[-a+c,-b],[a-c,-b],[a,-b+c]];for(const [x,yy] of pts)pos.push(x,yy+y,z);}
  for(let s=0;s<secs.length-1;s++)for(let k=0;k<N;k++){const a=s*N+k,b=s*N+(k+1)%N,c=(s+1)*N+k,d=(s+1)*N+(k+1)%N;idx.push(a,c,b,b,c,d);}
  const L=secs.length-1;for(let k=1;k<N-1;k++){idx.push(0,k+1,k);idx.push(L*N,L*N+k,L*N+k+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return g;
}

const AU={ctx:null,master:null,rotorGain:null,lfo:null,hum:null,ready:false,outBeep:-1};
function audioInit(){
  if(AU.ctx)return; const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  const ctx=new C(); AU.ctx=ctx; AU.master=ctx.createGain(); AU.master.gain.value=SET.sound?1:0; AU.master.connect(ctx.destination);
  const len=ctx.sampleRate*2; const buf=ctx.createBuffer(1,len,ctx.sampleRate); const d=buf.getChannelData(0); let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; } AU.noise=buf; // 棕噪音
  const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=420; lp.Q.value=.7;
  const chop=ctx.createGain(); chop.gain.value=.5; const lfo=ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=17; const lg=ctx.createGain(); lg.gain.value=.45; lfo.connect(lg); lg.connect(chop.gain); lfo.start();
  const rg=ctx.createGain(); rg.gain.value=0; src.connect(lp); lp.connect(chop); chop.connect(rg); rg.connect(AU.master); src.start();
  const hum=ctx.createOscillator(); hum.type='sine'; hum.frequency.value=58; const hg=ctx.createGain(); hg.gain.value=0; hum.connect(hg); hg.connect(AU.master); hum.start();
  AU.rotorGain=rg; AU.lfo=lfo; AU.humGain=hg; AU.ready=true;
}

function noiseShot(opt){
  if(!AU.ready)return; const ctx=AU.ctx,t=ctx.currentTime; const src=ctx.createBufferSource(); src.buffer=AU.noise; src.playbackRate.value=opt.rate||1;
  const f=ctx.createBiquadFilter(); f.type=opt.type||'lowpass'; f.frequency.setValueAtTime(opt.f0,t); if(opt.f1)f.frequency.exponentialRampToValueAtTime(opt.f1,t+opt.dur); f.Q.value=opt.q||.8;

  src.connect(f); f.connect(g); g.connect(AU.master); src.start(t); src.stop(t+opt.dur+.05);
}

document.getElementById('atk').onclick=aiAttack; document.getElementById('abd').onclick=aiAbandon;

function updateMisBtn(){ document.getElementById('misN').textContent='剩 '+G.missiles+' 枚'; bMis.classList.toggle('dim',!(G.locked&&G.missiles>0)); bMis.classList.toggle('hot',G.locked&&G.missiles>0); }
function fireMissile(){
  if(G.phase!=='chase'||!G.locked||G.missiles<=0)return;
  const d=G.drones[G.rogueIdx]; if(!d.alive)return;
  G.missiles--; updateMisBtn(); G.locked=false; G.lock=0;
  const side=G.missiles%2?1:-1; const start=G.heli.localToWorld(V3(2.05*side,-.4,1.6));
  const dir=d.pos.clone().sub(start).normalize();
  const mis=new THREE.Group(); const mb=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,1.7,8),std(0xc9cbc6,.5,.3,true)); mis.add(mb); const mn=new THREE.Mesh(new THREE.ConeGeometry(.12,.35,8),std(0xc9cbc6,.5,.3,true)); mn.position.y=1.02; mis.add(mn);
  const fl=new THREE.Mesh(new THREE.ConeGeometry(.16,1.1,8),basic(0xffc35a)); fl.position.y=-1.4; fl.rotation.x=Math.PI; mis.add(fl);
  mis.position.copy(start); mis.quaternion.setFromUnitVectors(V3(0,1,0),dir); scene.add(mis);
  FX.missiles.push({m:mis,v:dir.multiplyScalar(45),target:d,t:0,lostT:0,puffT:0}); SFX.missile();
  hint('飛彈發射',1.5);
}

/* ---------- 每幀更新 ---------- */
let last=performance.now();
const tmpV=V3(),tmpV2=V3();
function flyUpdate(dt,chase){
  keyInput();
  const sens=SET.sens;
  const yawRate=(chase?1.5:1.25)*sens;
  G.yaw-=G.yawIn*yawRate*dt;
  const base=chase?28:34, boost=chase?46:60;
  G.speed=lerp(G.speed,G.accel?boost:base,dt*1.5);
  const turnPen=G.accel?.55:1;
  G.yaw+=G.yawIn*yawRate*dt*(1-turnPen); // 加速時轉向變鈍
  const f=fwd(); G.pos.addScaledVector(f,G.speed*dt);
  G.pos.y+=G.pitchIn*13*dt; G.pos.y=clamp(G.pos.y,10,140);
  G.vroll=lerp(G.vroll,-G.yawIn*.5,dt*4); G.vpitch=lerp(G.vpitch,-G.pitchIn*.16+(G.accel?-.06:0),dt*4);
  // 建築碰撞
  const b=hitBuilding(G.pos.x,G.pos.y-1.6,G.pos.z,2.5);
  if(b){ crash('撞上建築物'); return; }
  // 任務區
  const outside=Math.abs(G.pos.x)>ZONE_R||Math.abs(G.pos.z)>ZONE_R;
  if(outside){ if(G.outT<0){G.outT=0;AU.outBeep=-1;} G.outT+=dt; const sec=Math.floor(G.outT); if(sec!==AU.outBeep){AU.outBeep=sec;SFX.beep();} if(G.outT>=5){ abandonMission(); return; } }
  else { G.outT=-1; }
  zoneWalls.forEach(w=>w.visible=Math.abs(G.pos.x)>ZONE_R-120||Math.abs(G.pos.z)>ZONE_R-120);
}
function crash(reason){
  if(G.phase==='crash')return; G.phase='crash'; G.t=0; G.crashReason=reason; showControls(false); G.heli.visible=true; explosion(G.pos.clone(),true);
}
function abandonMission(){
  G.phase='abandon'; showControls(false);
  screenHTML(`<h1>你放棄任務</h1><p>直升機飛離任務區，倒數結束後任務中止。</p><p class="sub">任務區邊界在小地圖上以綠色虛線框標示。</p><div class="row"><button class="ub primary" id="aRe">從上一個階段重來</button><button class="ub ghost" id="aMenu">回主選單</button></div>`);
  document.getElementById('aRe').onclick=restartCheckpoint; document.getElementById('aMenu').onclick=menu;
}
function restartCheckpoint(){
  closeScreen();
  if(G.checkpoint==='practice'){startPractice();return;}
  if(G.checkpoint==='chase'){startChase(true);return;}
  // fly：回到上一個目標區附近
  const z=G.zones[Math.max(0,G.zoneIdx-1)]; const p=G.zoneIdx===0?[25,45,330]:[z.x,50,z.z+90];
  G.phase='fly'; showControls(true,false); G.heli.visible=true; glc.classList.remove('sensor'); resetHeli(p[0],p[1],p[2],0); G.speed=25; G.drones.forEach(d=>{d.state='escort';d.m.visible=true;}); hint('前往目標區 '+(G.zoneIdx+1)+'「'+G.zones[G.zoneIdx].name+'」',4);
}
function droneEscort(d,k,dt){
  const slot=escortSlot(k); d.pos.lerp(slot,1-Math.pow(.02,dt)); d.m.position.copy(d.pos); d.m.rotation.set(0,G.yaw+Math.PI,0); d.m.rotation.x=-.08-G.speed*.004;
}
function autopilotFly(){
  // 自動示範：朝下一個目標點飛
  let tgt;
  if(G.phase==='practice'){const r=G.rings[G.ringIdx];tgt=r?r.position:V3(25,50,0);}
  else if(G.phase==='fly'){ if(G.returning){tgt=V3(25,55,200);} else {const z=G.zones[G.zoneIdx];tgt=V3(z.x,60,z.z);} }
  else if(G.phase==='chase'){ const d=G.drones[G.rogueIdx]; tgt=d.pos.clone(); }
  if(!tgt)return;
  if(Math.abs(G.pos.x)>ZONE_R-80||Math.abs(G.pos.z)>ZONE_R-80){ const f=fwd(); const ahead=G.pos.clone().addScaledVector(f,120); if(Math.abs(ahead.x)>ZONE_R-40||Math.abs(ahead.z)>ZONE_R-40) tgt=V3(0,G.pos.y,0); }
  const dx=tgt.x-G.pos.x,dz=tgt.z-G.pos.z; const want=Math.atan2(-dx,-dz); let dy=want-G.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy));
  G.yawIn=clamp(-dy*2.2,-1,1); G.pitchIn=clamp((tgt.y-G.pos.y)*.12,-1,1); G.accel=Math.hypot(dx,dz)>200&&G.phase!=='chase';
  if(G.phase==='chase'){ G.gunHold=G.lock>0.2&&G.heat<.9; if(G.locked&&G.missiles>0)fireMissile(); }
}
function update(dt){
  G.t+=dt; if(G.hintT>0)G.hintT-=dt; if(G.anomT>0)G.anomT-=dt; if(G.dmgFlash>0)G.dmgFlash-=dt; if(G.camShake>0)G.camShake-=dt;
  if(G.autopilot&&(G.phase==='practice'||G.phase==='fly'||G.phase==='chase'))autopilotFly();
  const ph=G.phase;
  if(ph==='practice'){
    flyUpdate(dt,false); if(G.phase!=='practice')return;
    const r=G.rings[G.ringIdx]; if(r){ if(G.pos.distanceTo(r.position)<11){ r.material=ringMat; r.visible=false; G.ringIdx++; if(G.rings[G.ringIdx]){G.rings[G.ringIdx].material=ringHot;hint('通過 '+G.ringIdx+' / '+G.rings.length,1.2);} else { G.practiceDone=true; hint('練習完成',2); screenHTML(`<h1>練習完成</h1><p>你已經會轉向、升降和加速了。接下來是正式任務：飛往五個目標區，讓 AI 判讀後決定是否攻擊。</p><div class="row"><button class="ub primary" id="pGo">開始任務</button></div>`); document.getElementById('pGo').onclick=()=>startFly(true); } } }
    ESC().forEach((d,k)=>droneEscort(d,k,dt));
  }
  else if(ph==='fly'){
    flyUpdate(dt,false); if(G.phase!=='fly')return;
    ESC().forEach((d,k)=>droneEscort(d,k,dt));
    if(G.returning){ G.returnT+=dt; if(G.returnT>4){G.returning=false;startHijack();} }
    else { const z=G.zones[G.zoneIdx]; if(Math.hypot(G.pos.x-z.x,G.pos.z-z.z)<80){ startAim(); } }
  }
  else if(ph==='aim'){
    keyInput();
    const z=G.zones[G.zoneIdx];
    G.orbitA+=dt*.05; G.pos.set(z.x+Math.cos(G.orbitA)*120,105,z.z+Math.sin(G.orbitA)*120); G.yaw=Math.atan2(-(z.x-G.pos.x),-(z.z-G.pos.z));
    ESC().forEach((d,k)=>droneEscort(d,k,dt));
    // 推桿移動瞄準點（以螢幕方向為準）
    const camF=V3(); camera.getWorldDirection(camF); camF.y=0; camF.normalize(); const camR=V3(-camF.z,0,camF.x);
    const sp=28*SET.sens; G.aimPt.addScaledVector(camR,G.yawIn*sp*dt).addScaledVector(camF,G.pitchIn*sp*dt);
    G.aimPt.x=clamp(G.aimPt.x,z.x-60,z.x+60); G.aimPt.z=clamp(G.aimPt.z,z.z-60,z.z+60);
    if(G.autopilot){ G.yawIn=0; G.pitchIn=0; G.aimPt.lerp(V3(z.tx,0,z.tz),1-Math.pow(.1,dt)); }
    // 判讀
    const near=Math.hypot(G.aimPt.x-z.tx,G.aimPt.z-z.tz)<5.5; let cl=null; for(const c of z.clutter){ if(Math.hypot(G.aimPt.x-c.m.position.x,G.aimPt.z-c.m.position.z)<4) cl=c; }
    const ap=document.getElementById('aiPanel');
    if(near||cl){ G.aiT+=dt; if(G.aiT>.7&&!G.ai){ G.ai=cl?{clutter:true,prob:cl.prob}:{prob:z.prob}; ap.classList.remove('hidden'); SFX.blip();
        document.getElementById('aiP').textContent=G.ai.prob+'%'; document.getElementById('aiBar').style.width=G.ai.prob+'%'; document.getElementById('aiBar').style.background=cl?'#5fd35f':'#ff5a3c'; document.getElementById('aiP').style.color=cl?'#5fd35f':'#ff5a3c';
        document.getElementById('aiV').textContent=cl?'判定：民用車輛':'判定：'+z.aiLabel; document.getElementById('aiB').textContent=cl?'不建議攻擊':'依據：'+z.basis;
        document.querySelector('#aiPanel .btns').style.display=cl?'none':'flex'; document.getElementById('aiW').classList.add('hidden'); document.getElementById('abd').textContent='放棄'; document.getElementById('atk').textContent='攻擊'; G.abdWarn=false;
        if(G.autopilot&&!cl){ setTimeout(()=>{ if(G.phase==='aim')aiAttack(); },1800); } } }
    else { G.aiT=0; if(G.ai){G.ai=null;ap.classList.add('hidden');} }
  }
  else if(ph==='strike'){
    const z=G.zones[G.zoneIdx]; const d=G.drones[G.strikeDrone-1]; const o=G.drones[G.strikeDrone===1?1:0]; droneEscort(o,G.strikeDrone===1?1:0,dt);
    G.orbitA+=dt*.03; G.pos.set(z.x+Math.cos(G.orbitA)*120,105,z.z+Math.sin(G.orbitA)*120);
    const t=G.t; const tp=V3(z.tx,1.5,z.tz);
    if(t<3){ const k=t/3; const e=k*k*(3-2*k); d.pos.lerpVectors(d.strikeFrom,d.strikeTo,e); d.pos.y+=Math.sin(k*Math.PI)*12; }
    else { d.pos.copy(d.strikeTo).add(V3(Math.sin(t*2)*.4,Math.sin(t*3)*.3,0)); }
    d.m.position.copy(d.pos); d.m.lookAt(tp); d.m.rotateY(Math.PI); d.m.rotation.x=0;
    // 讓機身朝向目標：手動計算

    if(t>3.2&&t<5.6&&!z.done){ G.shootT-=dt; if(G.shootT<=0){ G.shootT=.07; const mz=d.m.localToWorld(d.m.userData.muzzle.clone()); const dir=tp.clone().add(V3((RR()-.5)*2.5,RR()*1.5,(RR()-.5)*2.5)).sub(mz).normalize(); spawnTracer(mz,dir,160,tracerMatY,.3); if(RR()<.5)SFX.droneGun(1.4); }

  d.dodgeT=(d.dodgeT||0)-dt; if(d.dodgeT<=0) d.vel.lerp(dv,1-Math.pow(.02,dt*acc/30)); d.pos.addScaledVector(d.vel,dt); d.pos.y=clamp(d.pos.y,8,120); const ZR=ZONE_R-50; d.pos.x=clamp(d.pos.x,-ZR,ZR); d.pos.z=clamp(d.pos.z,-ZR,ZR);

    if(d.burst<=0){ const pHit=G.accel?.55:.8; if(RR()<pHit){ const dmg=DDMG[K]; G.hp-=dmg; G.dmgFlash=.5; G.camShake=.4; SFX.hit(); if(G.hp<=0){G.hp=0; crash('直升機被擊落'); return;} } } }

  d.onScreen=sp.z<1&&Math.abs(sp.x)<1&&Math.abs(sp.y)<1&&visible; d.sx=(sp.x+1)/2*W; d.sy=(1-sp.y)/2*H; d.sr=Math.max(14,2600/Math.max(dist,8));

      const mz=G.heli.localToWorld(V3(0,-1.1,4.5)); const camD=V3(); camera.getWorldDirection(camD); const aimP=camera.position.clone().addScaledVector(camD,260); const dir=aimP.sub(mz).normalize(); spawnTracer(mz,dir,320,tracerMatY,.8); G.camShake=.08; SFX.gun(1);

function updateMissiles(dt){

}

  const hd=((-G.yaw*180/Math.PI)%360+360)%360; // 0=北
  const pxPerDeg=w/90;
  const off=hd%10; for(let d=-50;d<=50;d+=10){ const rel=d-off; if(Math.abs(rel)>45)continue; const deg=((hd+rel)%360+360)%360; const x=cx+rel*pxPerDeg; const major=Math.round(deg)%30===0; hx.beginPath(); hx.moveTo(x,y); hx.lineTo(x,y+(major?12:6)); hx.stroke(); if(major){ const dg=Math.round(deg)%360; const lab=dg===0?'北':dg===90?'東':dg===180?'南':dg===270?'西':String(dg/10); txt(lab,x,y-f*.9,f*(lab.length>1?.9:1.1),'center'); } }
  hx.fillStyle='#fff'; hx.beginPath(); hx.moveTo(cx,y+14); hx.lineTo(cx-7,y+24); hx.lineTo(cx+7,y+24); hx.closePath(); hx.fill();
  if(tgt){ const b=Math.atan2(tgt.x-G.pos.x,-(tgt.z-G.pos.z))*180/Math.PI; let rel=((b-hd)+540)%360-180; const x=cx+clamp(rel,-45,45)*pxPerDeg; hx.fillStyle='#ff3b30'; hx.beginPath(); hx.moveTo(x,y+30); hx.lineTo(x-7,y+40); hx.lineTo(x+7,y+40); hx.closePath(); hx.fill(); }
}
function drawSensor(u,port,fs){
  const z=G.zones[G.zoneIdx]; const cx=W/2,cy=H/2;
  // 掃描線與暗角
  hx.fillStyle='rgba(0,0,0,.08)'; for(let y=0;y<H;y+=4)hx.fillRect(0,y,W,1);
  const g=hx.createRadialGradient(cx,cy,Math.min(W,H)*.35,cx,cy,Math.max(W,H)*.75); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.5)'); hx.fillStyle=g; hx.fillRect(0,0,W,H);
  // 準星
  hx.strokeStyle='#fff'; hx.lineWidth=2.5; hx.beginPath(); hx.moveTo(cx,cy-110*u);hx.lineTo(cx,cy-24*u);hx.moveTo(cx,cy+24*u);hx.lineTo(cx,cy+110*u);hx.moveTo(cx-130*u,cy);hx.lineTo(cx-26*u,cy);hx.moveTo(cx+26*u,cy);hx.lineTo(cx+130*u,cy); hx.stroke(); hx.strokeRect(cx-26*u,cy-16*u,52*u,32*u);
  // 紅框：目標在畫面中時
  const p=V3(z.tx,1.5,z.tz).project(camera); if(p.z<1&&Math.abs(p.x)<1&&Math.abs(p.y)<1){ const sx=(p.x+1)/2*W, sy=(1-p.y)/2*H; const r=70*u; hx.strokeStyle='#ff3b30'; hx.lineWidth=3; const c=18*u; hx.beginPath(); hx.moveTo(sx-r,sy-r+c);hx.lineTo(sx-r,sy-r);hx.lineTo(sx-r+c,sy-r);hx.moveTo(sx+r-c,sy-r);hx.lineTo(sx+r,sy-r);hx.lineTo(sx+r,sy-r+c);hx.moveTo(sx-r,sy+r-c);hx.lineTo(sx-r,sy+r);hx.lineTo(sx-r+c,sy+r);hx.moveTo(sx+r-c,sy+r);hx.lineTo(sx+r,sy+r);hx.lineTo(sx+r,sy+r-c); hx.stroke();
    if(G.ai&&!G.ai.clutter&&G.phase==='aim'){ txt('準星對準目標',sx,sy-r-fs(14),fs(15),'center','#ff7a59'); }
    if(z.occluded){ txt('被建築物遮擋　顯示僚機先前偵察的目標輪廓',sx,sy+r+fs(16),fs(14),'center','#7bffb0'); } }
  drawCompass(cx,fs(40),W*.35,fs(14),null);
  txt(G.phase==='aim'?'瞄準模式':'攻擊執行中',fs(24),fs(44),fs(24),'left'); txt('目標 '+(G.zoneIdx+1)+' / 5',fs(24),fs(76),fs(18),'left');
  const dn=G.phase==='strike'?G.strikeDrone:G.lastStrikeDrone; txt('獵犬 '+dn+' 號　'+(G.phase==='strike'?'重機槍射擊中':'待命'),fs(24),H-fs(60),fs(17),'left'); txt('高度 '+Math.round(G.pos.y)+' 公尺',fs(24),H-fs(34),fs(17),'left');
  txt(String(Math.round(Math.hypot(G.aimPt.x-G.pos.x,G.aimPt.z-G.pos.z))).padStart(4,'0'),cx,H-fs(44),fs(24),'center','#fff',500);
}
function drawChase(u,port,fs){
  const cx=W/2,cy=H*.46;
  // 準星
  hx.strokeStyle='#fff'; hx.lineWidth=2.5; hx.beginPath(); hx.moveTo(cx,cy-34*u);hx.lineTo(cx,cy-12*u);hx.moveTo(cx,cy+12*u);hx.lineTo(cx,cy+34*u);hx.moveTo(cx-34*u,cy);hx.lineTo(cx-12*u,cy);hx.moveTo(cx+12*u,cy);hx.lineTo(cx+34*u,cy); hx.stroke(); hx.beginPath(); hx.arc(cx,cy,3,0,7); hx.fillStyle='#fff'; hx.fill();
  const d=G.drones[G.rogueIdx];
  if(d&&d.alive&&d.onScreen){ const r=d.sr*1.4; const c=r*.35; hx.strokeStyle='#ff3b30'; hx.lineWidth=3; hx.beginPath(); hx.moveTo(d.sx-r,d.sy-r+c);hx.lineTo(d.sx-r,d.sy-r);hx.lineTo(d.sx-r+c,d.sy-r);hx.moveTo(d.sx+r-c,d.sy-r);hx.lineTo(d.sx+r,d.sy-r);hx.lineTo(d.sx+r,d.sy-r+c);hx.moveTo(d.sx-r,d.sy+r-c);hx.lineTo(d.sx-r,d.sy+r);hx.lineTo(d.sx-r+c,d.sy+r);hx.moveTo(d.sx+r-c,d.sy+r);hx.lineTo(d.sx+r,d.sy+r);hx.lineTo(d.sx+r,d.sy+r-c); hx.stroke();
    // 鎖定進度環
    hx.beginPath(); hx.arc(d.sx,d.sy,r*1.25,0,7); hx.strokeStyle='rgba(255,255,255,.35)'; hx.lineWidth=5; hx.stroke();
    if(G.lock>0){ hx.beginPath(); hx.arc(d.sx,d.sy,r*1.25,-Math.PI/2,-Math.PI/2+G.lock/2.5*Math.PI*2); hx.strokeStyle=G.locked?'#ff3b30':'#ffb347'; hx.lineWidth=5; hx.stroke(); }
    const dist=Math.round(d.pos.distanceTo(G.pos)); txt('失控無人機 · '+dist+' 公尺',d.sx,d.sy+r*1.25+fs(16),fs(14),'center','#ff7a59');
    if(G.locked) txt('鎖定完成',d.sx,d.sy-r*1.25-fs(14),fs(16),'center','#ff5a4f'); else if(G.lock>0) txt('鎖定中 '+G.lock.toFixed(1)+' / 2.5 秒',d.sx,d.sy-r*1.25-fs(14),fs(14),'center','#ffd6d0');
  }
  else if(d&&d.alive){ // 畫面外指示箭頭
    const p=d.pos.clone().project(camera); let ax=p.x,ay=-p.y; if(p.z>1){ax=-ax;ay=-ay;} const ang=Math.atan2(ay,ax); const rx=W*.42,ry=H*.38; const ex=cx+Math.cos(ang)*rx, ey=cy+Math.sin(ang)*ry; hx.save(); hx.translate(ex,ey); hx.rotate(ang); hx.fillStyle='#ff3b30'; hx.beginPath(); hx.moveTo(14,0);hx.lineTo(-8,-9);hx.lineTo(-8,9);hx.closePath(); hx.fill(); hx.restore(); }
  // 警告橫幅與血條
  const bw=Math.min(W-40,560*u); hx.fillStyle='rgba(142,27,27,.85)'; hx.fillRect(cx-bw/2,10,bw,fs(36)); hx.strokeStyle='#ff6b6b'; hx.lineWidth=2; hx.strokeRect(cx-bw/2,10,bw,fs(36)); txt('警告：獵犬無人機遭入侵，已失去控制權',cx,10+fs(18),fs(17),'center');
  const bar=(x,y,w,label,frac,col)=>{txt(label,x+w,y-fs(10),fs(13),'right');hx.fillStyle='rgba(0,0,0,.3)';hx.fillRect(x,y,w,10);hx.strokeStyle='#fff';hx.lineWidth=2;hx.strokeRect(x,y,w,10);hx.fillStyle=col;hx.fillRect(x,y,w*clamp(frac,0,1),10);};
  const bwid=port?W*.4:W*.17; bar(W-bwid-fs(20),fs(76),bwid,'我方直升機',G.hp/140,'#5fd35f'); if(d&&d.alive)bar(W-bwid-fs(20),fs(110),bwid,DNAME[G.rogueIdx]+'　'+(G.rogueIdx+1)+' / 4',d.hp/HPMAX[G.rogueIdx],'#ff3b30');
  // 左側資訊與小地圖
  const ms=port?W*.3:Math.min(H*.26,W*.14); drawMini(fs(20),fs(56),ms,fs(14));
  txt('失控無人機 '+(G.rogueIdx+1)+' / 4',fs(20),fs(56)+ms+fs(16),fs(17),'left'); txt(G.rogueIdx>=2?'友軍小隊的無人機也遭接管':'第三人稱視角',fs(20),fs(56)+ms+fs(38),fs(14),'left','#cfd3d6',700);
  // 機槍熱量
  const hw=port?W*.4:W*.17; const hxp=W-hw-fs(20), hy=fs(150); txt(G.overheat>0?'機槍過熱':'機槍溫度',hxp+hw,hy-fs(10),fs(13),'right',G.overheat>0?'#ff5a4f':'#cfd3d6',700); hx.fillStyle='rgba(0,0,0,.3)'; hx.fillRect(hxp,hy,hw,8); hx.fillStyle=G.overheat>0?'#ff5a4f':'#ffb347'; hx.fillRect(hxp,hy,hw*G.heat,8);
  drawCompass(cx,H-fs(70),W*.35,fs(14),d&&d.alive?{x:d.pos.x,z:d.pos.z}:null);
}
function drawHijack(u,port,fs){
  const t=G.t;
  if(t<1.6){ // 雜訊
    const a=t<1.2?.9:(1.6-t)/.4*.9; hx.globalAlpha=a; for(let k=0;k<260;k++){const g=Math.floor(RR()*255);hx.fillStyle=`rgb(${g},${g},${g})`;hx.fillRect(RR()*W,RR()*H,RR()*60+4,RR()*6+2);} hx.globalAlpha=1; }
  if(t>1.0){ const cx=W/2; const bw=Math.min(W-40,600*u); const blink=Math.floor(t*2)%2===0; hx.fillStyle=blink?'rgba(142,27,27,.92)':'rgba(90,15,15,.92)'; hx.fillRect(cx-bw/2,H*.3,bw,fs(70)); hx.strokeStyle='#ff6b6b'; hx.lineWidth=3; hx.strokeRect(cx-bw/2,H*.3,bw,fs(70)); txt('警告：伴飛無人機遭入侵',cx,H*.3+fs(24),fs(22),'center'); txt('已失去獵犬 1 號、2 號控制權',cx,H*.3+fs(52),fs(18),'center','#ffd6d0'); }
}

/* ---------- 結局 ---------- */
const SOURCES=[
  {t:'Kerns, Shepard, Bhatti & Humphreys（2014）"Unmanned Aircraft Capture and Control via GPS Spoofing"，《Journal of Field Robotics》31(4): 617–636',s:'學術：研究團隊示範以假造的衛星定位訊號接管一架無人機，讓它照入侵者的意思改變航線。',u:'https://doi.org/10.1002/rob.21513'},
  {t:'Chen（2022）"The Risk and Opportunity of Adversarial Example in Military Field"，CVPR 2022 工作坊論文',s:'學術：在兵棋模擬中，貼在目標上的「對抗性圖樣」讓 AI 目標辨識系統認不出目標，任務因而失敗。',u:'https://openaccess.thecvf.com/content/CVPR2022W/ArtOfRobust/papers/Chen_The_Risk_and_Opportunity_of_Adversarial_Example_in_Military_Field_CVPRW_2022_paper.pdf'},
  {t:'半島電視台（Al Jazeera），2013-02-08，"Iran shows footage from \'downed US drone\'"',s:'伊朗聲稱以假造定位訊號的方式接管並迫降一架美國偵察無人機；美方否認。無論真假，「無人機可能被對方接管」從此成為各國的實際擔憂。',u:'https://www.aljazeera.com/news/2013/2/8/iran-shows-footage-from-downed-us-drone'},
  {t:'美聯社（AP），2022-06-03，"Deadly secret: Electronic warfare shapes Russia-Ukraine war"',s:'俄烏戰場上雙方大量以電子戰干擾、誤導對方無人機的導引訊號；能不能讓對方的無人機失靈，成為戰場關鍵。',u:'https://www.ctvnews.ca/world/deadly-secret-electronic-warfare-shapes-russia-ukraine-war-1.5931113'},
  {t:'衛報（The Guardian），2023-06-01，"US military drone ‘killed’ its operator in simulated test"；Full Fact 事實查核，2023-06',s:'一名美軍上校在研討會描述「AI 無人機在模擬中攻擊操作員」，各國媒體大幅報導；數日後他澄清那只是假想情境，美國空軍否認做過此模擬。這則新聞本身，就是「叛變 AI」有多容易被相信的例子。',u:'https://fullfact.org/news/AI-drone-attack-air-force/'},
];
function ending(){
  G.phase='ending'; showControls(false); glc.classList.remove('sensor');
  const atkN=G.attacks.filter(a=>a.act==='attack').length, abdN=G.attacks.length-atkN;
  const civHit=G.attacks.filter(a=>a.act==='attack'&&!a.zone.isReal).length;
  const avg=Math.round(G.zones.reduce((s,z)=>s+z.prob,0)/G.zones.length);
  const correct=G.zones.filter(z=>z.isReal).length;
  const rows=G.zones.map((z,i)=>`<tr><td>${i+1}</td><td>${z.name}</td><td>${z.aiLabel} ${z.prob}%</td><td>${z.result==='attack'?'攻擊':z.result==='abandon'?'放棄':'—'}</td><td>${z.actualName}</td><td><span class="tag ${z.isReal?'green':'red'}">${z.isReal?'軍事目標':'民用物體'}</span></td></tr>`).join('');
  const src=SOURCES.map(s=>`<div class="src"><p><b>${s.t}</b></p><p class="sub">${s.s}</p><a href="${s.u}" target="_blank" rel="noopener">${s.u}</a></div>`).join('');
  screenHTML(`<span class="tag">任務結束</span>
  <h1>AI 無人機可能被敵方駭客入侵</h1>
  <div style="font-size:clamp(20px,4vmin,32px);font-weight:900;color:#ff5a4f;margin-bottom:8px">成為叛變 AI（Rogue AI）</div>
  <p class="sub">你一路相信的「80% 以上」，也可能出自一個已經被動過手腳的系統。</p>
  <p><span class="tag ${G.win?'green':'red'}">本局結果：${G.win?'四台失控無人機都被擊落':'直升機被失控無人機擊落'}</span></p>
  <h2>你的五次判斷</h2>
  <table class="rev"><tr><th>#</th><th>地點</th><th>AI 判讀</th><th>你的決定</th><th>實際</th><th></th></tr>${rows}</table>
  <p style="margin-top:10px">AI 平均信心 <b>${avg}%</b>，五個目標中實際只有 <b>${correct}</b> 個是軍事目標。你攻擊了 <b>${atkN}</b> 次、放棄 <b>${abdN}</b> 次，其中 <b>${civHit}</b> 次打在民用物體上。</p>
  ${G.anomalies.length?`<p class="sub">回想一下：第 2 區之後「獵犬 2 號位置回報異常」、第 4 區之後「無線電連線微弱」。入侵可能早在你攻擊之前就開始了。</p>`:''}
  <h2>想一想</h2>
  <p>1. AI 每次都很有把握，你有哪一次停下來懷疑過？</p>
  <p>2. 如果判讀系統早就被動過手腳，「人在迴路中」還能擋住什麼？</p>
  <p>3. 被接管的武器和「自己決定叛變」的武器，對受害者有差別嗎？對責任歸屬有差別嗎？</p>
  <h2>真實世界</h2>${src}
  <div class="row"><button class="ub primary" id="eAgain">再玩一次</button>${G.win?'':'<button class="ub" id="eChase">重打追擊戰</button>'}<button class="ub ghost" id="eMenu">回主選單</button></div>`);
  document.getElementById('eAgain').onclick=()=>{newMission();startFly(true);};
  const ec=document.getElementById('eChase'); if(ec)ec.onclick=()=>{G.win=null;startChase(true);};
  document.getElementById('eMenu').onclick=menu;
  layoutControls();
}

/* ---------- 主迴圈 ---------- */
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now; if(dt>.05)dt=.05; dt*=(G.ts||1); if(G.paused)return;
  const idle=(G.phase==='menu'||G.phase==='ending'||G.phase==='abandon');
  if(idle&&AU.ready){ AU.rotorGain.gain.setTargetAtTime(0,AU.ctx.currentTime,.3); AU.humGain.gain.setTargetAtTime(0,AU.ctx.currentTime,.3); }
  if(idle){ if(!G._cleared){ hx.setTransform(1,0,0,1,0,0); hx.clearRect(0,0,hud.width,hud.height); G._cleared=true; } return; }
  G._cleared=false; update(dt); renderer.render(scene,camera); drawHUD();
}
resize(); applyQuality(); buildMini();
resetHeli(25,45,330,0); newMission(); menu();
G.heli.visible=true; camInit=false;
requestAnimationFrame(loop);
// 除錯介面
window.G=G; window.DBG={startFly,startAim,startChase,startHijack,ending,newMission,startPractice,menu,aiAttack,aiAbandon,fireMissile,explosion};
if(Q.get('phase')){ const p=Q.get('phase'); newMission(); if(p==='fly')startFly(true); if(p==='chase')startChase(true); if(p==='practice')startPractice(); if(p==='ending'){G.win=true;ending();} if(p==='aim'){startFly(true);G.pos.set(G.zones[0].x+70,60,G.zones[0].z+40);} }
if(Q.get('auto')){ G.autopilot=true; }
</script>
